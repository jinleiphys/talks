name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Third time this was dropped when a deck started from a fresh
      # style.css (ce08a7a, then 82f48e9, then fudan_26_09_talk). Dev mode
      # never shows the dialog, so the only place it reproduces is the
      # deployed page, which is exactly where nobody is looking for it.
      - name: Every talk must hide the Slidev goto-dialog
        run: |
          missing=0
          for dir in $(find . -maxdepth 2 -name slides.md -exec dirname {} \; | sed 's|^\./||' | sort); do
            if ! grep -q 'slidev-goto-dialog' "$dir/style.css" 2>/dev/null; then
              echo "::error file=$dir/style.css::$dir/style.css is missing the #slidev-goto-dialog display:none rule; the goto dialog leaks into the production build"
              missing=1
            fi
          done
          exit $missing

      - name: Build all talks
        run: |
          mkdir -p _site
          cp index.html _site/

          for dir in $(find . -maxdepth 2 -name slides.md -exec dirname {} \; | sed 's|^\./||' | sort); do
            echo "::group::Building $dir"
            cd "$dir"
            npm install
            npm run build
            cd ..
            mkdir -p "_site/$dir"
            cp -r "$dir/dist"/* "_site/$dir/"
            echo "::endgroup::"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
